name: Build pinned llama.cpp CUDA image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - harness/docker/Dockerfile
      - .github/workflows/build-llamacpp-image.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned CUDA image
        id: image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: harness/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/majorminorlabs/vtm-llamacpp:84e66d0
          build-args: LLAMA_CPP_COMMIT=84e66d03218711dfcaa993e5f64a546abe82df9a
          labels: |
            org.opencontainers.image.source=https://github.com/majorminorlabs/vram-tier-map
            org.opencontainers.image.revision=84e66d03218711dfcaa993e5f64a546abe82df9a

      - name: Report immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Published image digest: ${DIGEST}"
          echo "Immutable reference: ghcr.io/majorminorlabs/vtm-llamacpp@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
